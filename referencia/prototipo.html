<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2F8FE0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pato Suerte">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icono-192.png">
<link rel="apple-touch-icon" href="icono-180.png">
</head>
<body>
<title>Tablero de Sorteos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Lilita+One&family=Luckiest+Guy&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: una sola columna centrada tipo app móvil; tablero 10×10 como corazón de la página, boleta perforada al final */
:root{
  --paper:#F1F4EF; --card:#FFFFFF; --ink:#11231E; --muted:#56675F; --line:#D5DDD6;
  --green:#0E6A4E; --green-ink:#FFFFFF; --green-soft:#DFEEE6;
  --sun:#F2B705; --sun-ink:#231A00; --sun-soft:#FBEFC4;
  --taken:#C23E2C; --taken-soft:#F6E0DA;
  --cab:#0C3A30; --cab-ink:#F1F4EF; --reel:#FFFFFF;
  --shadow:0 1px 2px rgb(17 35 30 / .06), 0 10px 28px rgb(17 35 30 / .07);
  --f-display:"Bricolage Grotesque","Arial Narrow",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#0C1512; --card:#13201C; --ink:#E6EEE9; --muted:#93A69E; --line:#24342F;
  --green:#3DBE8D; --green-ink:#03130D; --green-soft:#15322A;
  --sun:#F6C744; --sun-ink:#221800; --sun-soft:#3A3114;
  --taken:#FF7A66; --taken-soft:#3B1F1A;
  --cab:#0A2C25; --cab-ink:#E6EEE9; --reel:#F4F7F4;
  --shadow:none; color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#0C1512; --card:#13201C; --ink:#E6EEE9; --muted:#93A69E; --line:#24342F;
  --green:#3DBE8D; --green-ink:#03130D; --green-soft:#15322A;
  --sun:#F6C744; --sun-ink:#221800; --sun-soft:#3A3114;
  --taken:#FF7A66; --taken-soft:#3B1F1A;
  --cab:#0A2C25; --cab-ink:#E6EEE9; --reel:#F4F7F4;
  --shadow:none; color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0}
img{max-width:100%}
body{background:var(--paper);color:var(--ink);font:400 16px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-display);font-weight:800;line-height:1.08;text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:clamp(28px,6vw,40px)} h2{font-size:clamp(22px,4.5vw,28px)} h3{font-size:19px}
p{margin:0}
a{color:var(--green)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.stack{display:flex;flex-direction:column;gap:16px}
.muted{color:var(--muted)}
.small{font-size:14px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* Barra superior */
.top{padding-block:14px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font:800 19px/1 var(--f-display)}
.brand-mark{width:34px;height:34px;border-radius:9px;background:var(--green);color:var(--green-ink);display:grid;place-items:center;font:800 15px/1 var(--f-display)}
.demo-flag{font-size:12px;font-weight:700;background:var(--sun-soft);color:var(--ink);padding:4px 10px;border-radius:99px}

/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:700;cursor:pointer;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--green);border-color:var(--green);color:var(--green-ink)}
.btn-primary:hover{border-color:var(--green);filter:brightness(1.07)}
.btn-sun{background:var(--sun);border-color:var(--sun);color:var(--sun-ink)}
.btn-danger{color:var(--taken);border-color:var(--taken)}
.btn-sm{min-height:36px;padding:0 12px;font-size:14px;border-radius:10px}
.btn-block{width:100%}
.link-btn{background:none;border:0;padding:0;color:var(--green);font-weight:700;cursor:pointer}

/* Formularios */
label{font-weight:600;font-size:14px;display:block;margin-bottom:6px}
.field{display:flex;flex-direction:column}
input[type=text],input[type=tel],input[type=number],input[type=date],input[type=email],input[type=password],input:not([type]),select,textarea{
  width:100%;min-height:46px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card)}
textarea{min-height:110px;resize:vertical;line-height:1.45}
input[readonly]{background:var(--green-soft)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.check{display:flex;align-items:center;gap:10px;font-weight:600}
.check input{width:20px;height:20px}
.err{color:var(--taken);font-weight:600;font-size:14px}
.ok{color:var(--green);font-weight:600;font-size:14px}
.hint{font-size:13px;color:var(--muted);margin-top:6px}

/* Tarjetas */
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--green-soft);color:var(--ink)}
.pill.noche{background:var(--cab);color:var(--cab-ink)}
.pill.dia{background:var(--sun-soft)}
.pill.off{background:var(--taken-soft);color:var(--taken)}

/* Inicio */
.intro{padding-block:8px 4px}
.intro p{color:var(--muted);margin-top:8px;max-width:46ch}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.sorteo-card{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;text-decoration:none;color:var(--ink);box-shadow:var(--shadow);transition:transform .15s}
.sorteo-card:hover{transform:translateY(-2px)}
.sc-img{aspect-ratio:16/10;background:var(--cab);display:grid;place-items:center;overflow:hidden;max-width:100%}
.sc-img img{width:100%;height:100%;object-fit:cover}
.sc-fallback{font:800 26px/1 var(--f-display);color:var(--sun);text-align:center;padding:16px}
.sc-body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px}
.sc-meta{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted)}
.sc-nums{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sc-nums small{display:block;font-size:12px;color:var(--muted)}
.sc-nums b{font:800 19px/1.2 var(--f-display);font-variant-numeric:tabular-nums}
.sc-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;border-top:1px dashed var(--line);padding-top:10px;font-size:13px;color:var(--muted)}
.loteria{display:flex;align-items:center;gap:8px;min-width:0}
.loteria img{width:28px;height:28px;object-fit:contain;border-radius:6px;background:#fff}
.libres{font-weight:700;color:var(--green)}

/* Tragamonedas */
.slot{background:var(--cab);color:var(--cab-ink);border-radius:20px;padding:20px;display:grid;gap:16px;grid-template-columns:1fr;position:relative;overflow:hidden}
.slot .eyebrow{color:var(--sun)}
.slot h2{color:var(--cab-ink)}
.slot-info p{opacity:.88;margin-top:6px;font-size:15px}
.reels{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;background:rgb(0 0 0 / .25);padding:10px;border-radius:16px;border:2px solid var(--sun)}
.reel{background:var(--reel);border-radius:10px;aspect-ratio:1/1.05;display:grid;place-items:center;font-size:clamp(38px,11vw,58px);line-height:1;overflow:hidden;max-width:100%}
.reel span{display:block;transition:transform .08s}
.reel.spin span{filter:blur(1.2px);transform:translateY(4px)}
.reel.win{box-shadow:0 0 0 4px var(--sun) inset}
.slot-form{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.slot-form .field{flex:1 1 180px}
.slot-form label{color:var(--cab-ink)}
.slot-form input{background:var(--reel);color:#11231E;border-color:transparent}
.slot-msg{font-weight:700;min-height:1.5em}
.slot-msg a{color:var(--sun)}
@media (min-width:720px){.slot{grid-template-columns:1.1fr 1fr;align-items:center}.slot-form,.slot-msg{grid-column:1/-1}}

/* Vista sorteo */
.back{display:inline-flex;align-items:center;gap:6px;font-weight:700;text-decoration:none;padding-block:4px}
.s-head{display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:center}
.s-thumb{width:96px;height:96px;border-radius:14px;background:var(--cab);overflow:hidden;display:grid;place-items:center}
.s-thumb img{width:100%;height:100%;object-fit:cover}
.s-thumb .sc-fallback{font-size:15px;padding:6px}
.s-head-info{display:flex;flex-direction:column;gap:6px;min-width:0}
.s-line{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px;color:var(--muted)}
.premios{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.premio{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.premio.mayor{background:var(--sun-soft);border-color:var(--sun)}
.premio small{display:block;font-size:12px;color:var(--muted);font-weight:600}
.premio b{font:800 21px/1.2 var(--f-display);font-variant-numeric:tabular-nums}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:6px;border:1px solid var(--line);background:var(--card)}
.legend .l-sel{background:var(--sun);border-color:var(--sun)}
.legend .l-tak{background:var(--taken-soft);border-color:var(--taken)}
.board{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:clamp(3px,1vw,7px)}
.cell{aspect-ratio:1;min-width:0;border:1px solid var(--line);background:var(--card);border-radius:clamp(5px,1.4vw,9px);font:700 clamp(12px,3.4vw,17px)/1 var(--f-display);font-variant-numeric:tabular-nums;cursor:pointer;padding:0;position:relative;color:var(--ink)}
.cell:hover:not(:disabled){border-color:var(--green)}
.cell.sel{background:var(--sun);border-color:var(--sun);color:var(--sun-ink)}
.cell.taken{background:var(--taken-soft);border-color:transparent;color:var(--taken);cursor:not-allowed;text-decoration:line-through}
.cell.taken::after{content:"";position:absolute;inset:18%;background:linear-gradient(to top right,transparent 46%,currentColor 46% 54%,transparent 54%);opacity:.55}
.bar{position:sticky;bottom:0;z-index:5;margin-top:8px;padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));background:var(--paper);border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}
.bar b{font:800 18px/1.2 var(--f-display)}
.bar .muted{display:block;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:800 18px/1 var(--f-display);font-variant-numeric:tabular-nums;background:var(--sun);color:var(--sun-ink);padding:9px 12px;border-radius:10px}
.hola{background:var(--green-soft);padding:10px 12px;border-radius:10px;font-weight:600}

/* Boleta final */
.ticket{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}
.t-top{padding:20px;display:flex;flex-direction:column;gap:12px}
.t-rows{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:15px}
.t-rows dt{color:var(--muted)} .t-rows dd{margin:0;font-weight:700;text-align:right}
.perf{position:relative;height:0;border-top:2px dashed var(--line);margin:0 18px}
.perf::before,.perf::after{content:"";position:absolute;top:-13px;width:24px;height:24px;border-radius:50%;background:var(--paper);border:1px solid var(--line)}
.perf::before{left:-31px} .perf::after{right:-31px}
.t-pay{padding:20px;display:flex;flex-direction:column;gap:10px;background:var(--green-soft)}
.nequi-num{font:800 clamp(28px,8vw,38px)/1.1 var(--f-display);font-variant-numeric:tabular-nums;letter-spacing:.02em;user-select:all;word-break:break-all}

/* Admin */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.tab{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:8px 16px;font-weight:700;cursor:pointer}
.tab[aria-selected=true]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.adm-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.rows{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);background:var(--card);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
.row:first-child{border-top:0}
.row-main{flex:1 1 200px;min-width:0}
.row-main b{display:block}
.row-actions{display:flex;gap:8px;flex-wrap:wrap}
.thumb{width:48px;height:48px;border-radius:10px;background:var(--cab);overflow:hidden;flex:0 0 auto;display:grid;place-items:center;color:var(--sun);font:800 14px/1 var(--f-display)}
.thumb img{width:100%;height:100%;object-fit:cover}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat small{display:block;font-size:12px;color:var(--muted);font-weight:600}
.stat b{font:800 22px/1.2 var(--f-display);font-variant-numeric:tabular-nums}
.mini{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:3px}
.mini span{aspect-ratio:1;border-radius:4px;display:grid;place-items:center;font-size:clamp(9px,2.3vw,12px);font-weight:700;background:var(--paper);border:1px solid var(--line);font-variant-numeric:tabular-nums;min-width:0}
.mini .pend{background:var(--sun-soft);border-color:var(--sun)}
.mini .pag{background:var(--green);color:var(--green-ink);border-color:var(--green)}
.mini .fijo{background:var(--cab);color:var(--cab-ink);border-color:var(--cab)}
.nums-line{font-variant-numeric:tabular-nums;font-weight:600;word-break:break-word}
.state{font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--sun-soft)}
.state.pag{background:var(--green);color:var(--green-ink)}
.warn{background:var(--sun-soft);border:1px solid var(--sun);border-radius:12px;padding:10px 14px;font-size:14px}
.img-pick{display:flex;gap:12px;align-items:center}
.img-prev{width:72px;height:72px;border-radius:12px;background:var(--paper);border:1px dashed var(--line);display:grid;place-items:center;overflow:hidden;flex:0 0 auto;font-size:12px;color:var(--muted);text-align:center}
.img-prev img{width:100%;height:100%;object-fit:cover}
pre.code{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px;overflow-x:auto;font-size:13px;white-space:pre-wrap}
ol.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:12px 18px;border-radius:12px;font-weight:600;z-index:50;max-width:calc(100% - 32px)}
footer{padding-block:32px 24px;text-align:center;font-size:13px;color:var(--muted)}
footer a{color:var(--muted)}

/* Fortuna Diaria: pantalla completa con look propio (jade, madera y oro), igual en tema claro y oscuro */
.fortuna{--oro:#F2B705;--oro-osc:#8A5600;--teja:#C8402E;--jade:#1E8C80;
  min-height:calc(100svh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));
  display:flex;flex-direction:column;align-items:center;gap:16px;color:#FFFFFF;
  padding-block:14px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:
    radial-gradient(90% 45% at 50% 8%, rgb(120 220 170 / .28), transparent 70%),
    radial-gradient(60% 40% at 0% 100%, rgb(20 120 140 / .45), transparent 70%),
    repeating-linear-gradient(90deg, rgb(255 255 255 / .035) 0 3px, transparent 3px 74px),
    linear-gradient(180deg,#17604A 0%,#0D3D31 55%,#0A2B2F 100%)}
.f-top{width:100%;max-width:460px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px}
.f-negocio{font-weight:700;opacity:.9}
.f-skip{color:#FFE58A;font-weight:700;text-decoration:none}
.f-titulo{text-align:center;display:flex;flex-direction:column;gap:2px}
.f-titulo h1{display:flex;flex-direction:column;line-height:.9;font-size:clamp(44px,13vw,70px);letter-spacing:-.02em}
.f-titulo h1 span{background:linear-gradient(180deg,#FFF3B5 0%,#FFD03A 45%,#E39A00 70%,#B86A00 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #5C2D08) drop-shadow(0 8px 14px rgb(0 0 0 / .35))}
.f-titulo h1 span + span{font-size:.72em}
.f-titulo p{font-weight:700;color:#CFF3E2;letter-spacing:.06em;text-transform:uppercase;font-size:12px;margin-top:6px}
.marco-slot{position:relative;width:min(100%,440px);padding:16px 14px 14px;margin-top:12px;border-radius:16px;
  background:linear-gradient(180deg,#2DB0A4,#177A72);box-shadow:inset 0 0 0 3px #E8B64A,inset 0 0 0 7px #136660,0 22px 44px rgb(0 0 0 / .45)}
.marco-slot::before{content:"";position:absolute;left:-12px;right:-12px;top:-18px;height:28px;border-radius:9px;
  background:repeating-linear-gradient(90deg,#D24A35 0 12px,#A9301F 12px 15px);box-shadow:0 0 0 3px #E8B64A,0 6px 10px rgb(0 0 0 / .3)}
.f-base{position:absolute;left:22%;right:22%;bottom:-12px;height:16px;border-radius:0 0 12px 12px;background:linear-gradient(#E8B64A,#A8741A)}
.tablas{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:10px;border-radius:10px;
  background:repeating-linear-gradient(90deg,#2E6C57 0 31%,#255946 31% 32%),linear-gradient(180deg,#356F5C,#23574A);box-shadow:inset 0 4px 12px rgb(0 0 0 / .45)}
.tablas::after{content:"";position:absolute;left:4px;right:4px;top:calc(33.33% + 2px);height:calc(33.33% - 4px);border-radius:10px;
  border:2px dashed rgb(255 214 102 / .55);background:rgb(255 214 102 / .08);pointer-events:none}
.col{aspect-ratio:1/3;overflow:hidden;min-width:0;max-width:100%;position:relative;z-index:1}
.strip{display:flex;flex-direction:column;will-change:transform}
.sim{aspect-ratio:1;display:grid;place-items:center;padding:12%;border-radius:12px}
.sim svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 4px 3px rgb(0 0 0 / .35))}
.sim.gana{background:radial-gradient(circle,rgb(255 230 120 / .55),transparent 70%);box-shadow:0 0 0 3px #FFE14D inset,0 0 18px rgb(255 220 80 / .8);animation:latido .8s ease-in-out 3}
@keyframes latido{50%{transform:scale(1.08)}}
.f-reglas{text-align:center;font-size:14px;color:#E3F7EE;margin-top:6px}
.f-reglas b{color:#FFE58A}
.f-form{display:flex;flex-direction:column;align-items:center;gap:10px;width:min(100%,320px)}
.f-form label{color:#E3F7EE;margin:0}
.f-form input{text-align:center;background:#FFFFFF;color:#11231E;border:2px solid #E8B64A;font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
.giro{width:clamp(92px,26vw,116px);aspect-ratio:1;border-radius:50%;cursor:pointer;display:grid;place-items:center;margin-top:6px;
  background:radial-gradient(circle at 35% 28%,#FFE27A,#F5B000 58%,#C98200);border:6px solid rgb(0 0 0 / .32);
  box-shadow:0 8px 0 #7A4C00,0 16px 30px rgb(0 0 0 / .45);transition:transform .08s,box-shadow .08s}
.giro svg{width:52%;height:52%}

.pgrid{--gap:clamp(8px,2.6vw,14px);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:calc(var(--gap) * 1.6) var(--gap)}

.arte{position:absolute;inset:0}

  background:radial-gradient(circle at 40% 35%,#36DE76,#0F7A3A 75%);box-shadow:0 0 0 clamp(3px,1vw,5px) #FFD24A,0 0 0 clamp(5px,1.7vw,8px) #7A4A05,0 6px 14px rgb(0 0 0 / .4)}

  -webkit-text-stroke:clamp(1.5px,.5vw,2.5px) #3A1A00;paint-order:stroke fill;text-shadow:0 3px 0 #3A1A00}

.pc-precio{font:400 clamp(18px,5.6vw,34px)/1.05 "Anton",Impact,sans-serif;margin:0 clamp(4px,1.4vw,10px);font-variant-numeric:tabular-nums;

  filter:drop-shadow(0 2px 0 #FFFFFF) drop-shadow(0 4px 0 #5C2D08) drop-shadow(0 8px 10px rgb(0 0 0 / .35))}

  filter:drop-shadow(0 2px 0 #FFFFFF) drop-shadow(0 3px 0 #0E4A1C)}

/* Optimización móvil */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{overscroll-behavior-y:none}
body[data-vista="fortuna"]{background:#0F4148}
body[data-vista="menu"]{background:#170708}
a,button,input,select,textarea,.cell,.pcard{-webkit-tap-highlight-color:transparent}
button,.btn,.cell,.pcard,.tab,a{touch-action:manipulation}
input,select,textarea{font-size:16px}           /* evita el zoom automático del iPhone al escribir */
.cell{user-select:none;-webkit-user-select:none}
.cell:active:not(:disabled){transform:scale(.92)}
.cell.pop{animation:pop .35s ease-out}
@keyframes pop{50%{transform:scale(1.18)}}
.oculto{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (hover:none){.sorteo-card:hover,.pcard:hover{transform:none}.pcard:active{transform:scale(.97)}}
@media (pointer:coarse){.btn-sm{min-height:42px;padding:0 14px}.tab{padding:10px 18px}.link-btn{padding-block:8px}}

/* Ruleta: todo cabe en una pantalla de celular */
.fortuna{gap:clamp(8px,1.6svh,16px);padding-block:10px 22px}
.f-cab .f-logo{width:min(88%,360px,34svh)}
.marco-slot{width:min(100%,440px,44svh);margin-top:14px}
.f-form{gap:clamp(8px,1.4svh,12px)}

.giro-aro{padding:clamp(7px,1.2svh,12px)}
.f-reglas{font-size:13px}
.f-cta{min-height:52px;width:min(100%,320px)}

/* Tablero del sorteo */
@media (max-width:480px){
  main.wrap{padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}
  .board{gap:4px}
  .cell{border-radius:7px;font-size:clamp(13px,3.9vw,17px)}
  .s-head{grid-template-columns:72px 1fr;gap:12px}
  .s-thumb{width:72px;height:72px}
  .s-head h1{font-size:26px}
  .premios{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:8px;padding-bottom:4px;margin-inline:-10px;padding-inline:10px;scrollbar-width:none}
  .premios::-webkit-scrollbar{display:none}
  .premio{flex:0 0 auto;min-width:46%;scroll-snap-align:start}
  .bar{margin-inline:-10px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));box-shadow:0 -8px 20px rgb(0 0 0 / .08)}
  .bar .btn{min-height:52px;padding:0 22px;font-size:17px}
  .rows .row{padding:12px}
  .row-actions{width:100%}
  .row-actions .btn{flex:1 1 auto}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
}
.btn-block,.t-pay .btn{min-height:54px;font-size:17px}
#d-tel,#d-nombre{min-height:54px;font-size:18px}

/* Menú sin huecos: filas centradas y textos que crecen con el tamaño de la tarjeta */
.pflex{display:flex;flex-wrap:wrap;justify-content:center}
.pflex > .pcard{flex:0 0 calc((100% - (var(--cols) - 1) * var(--gap)) / var(--cols));max-width:calc((100% - (var(--cols) - 1) * var(--gap)) / var(--cols))}
.pcard{container-type:inline-size}
.pc-nombre{font-size:clamp(14px,13cqi,30px)}
.pc-precio{font-size:clamp(18px,16cqi,40px)}
.pc-lbl{font-size:clamp(9px,7.5cqi,14px)}
.pc-hora{font-size:clamp(10px,8.5cqi,16px)}
.arte-txt{font-size:clamp(12px,13cqi,30px)}
.m-cont{--gap:clamp(8px,2.6vw,14px)}
.pgrupos{align-items:stretch;gap:var(--gap)}
.pgrupo{flex:0 1 calc((100% - (var(--cols) - 1) * var(--gap)) / var(--cols) * var(--n) + (var(--n) - 1) * var(--gap));max-width:100%}
.pgrupo .pgrid-g{flex:1;gap:var(--gap)}
.pgrid-g > .pcard{height:100%}

/* Premios: todo visible en la pantalla del celular, sin deslizar */
.premios{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.premio{min-width:0}
.premio.mayor,.premio.ancho{grid-column:1/-1}

.premio.ancho{display:flex;align-items:center;justify-content:space-between;gap:10px}

  .premios{display:grid;overflow:visible;margin-inline:0;padding-inline:0}

/* Consulta de números en el menú */

/* Números ocupados tapados con logo */

/* Ruleta v3: castillo de piedra en el cielo, botón LANZA (look fijo; colores por --piedra y --lanza) */
body[data-vista="fortuna"]{background:#F3E9EF}
.cielo{--piedra:#4B57A0;--lanza:#E2402F;position:relative;overflow:hidden;isolation:isolate;color:#FFFFFF;
  min-height:calc(100svh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));
  display:flex;flex-direction:column;align-items:center;gap:clamp(6px,1.2svh,12px);
  padding-block:8px 18px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));
  background:linear-gradient(180deg,#2F8FE0 0%,#5DB2F0 38%,#A9D8F7 64%,#F6E8F0 82%,#F3E9EF 100%)}
.cielo.con-fondo{background:var(--fondo) center/cover no-repeat,#5DB2F0}
.cielo > *:not(.c-nubes){position:relative;z-index:1}
.c-nubes{position:absolute;inset:0;z-index:0;pointer-events:none}
.c-nubes i{position:absolute;display:block;border-radius:999px;background:#FFFFFF;opacity:.9;filter:blur(.5px)}
.c-nubes i::before,.c-nubes i::after{content:"";position:absolute;background:#FFFFFF;border-radius:50%}
.n1{width:170px;height:44px;left:-40px;top:9%}.n1::before{width:80px;height:70px;left:30px;top:-38px}.n1::after{width:60px;height:52px;left:95px;top:-26px}
.n2{width:150px;height:40px;right:-30px;top:6%;opacity:.75}.n2::before{width:70px;height:60px;left:28px;top:-32px}.n2::after{width:50px;height:44px;left:84px;top:-20px}
.n3{width:130%;height:34%;left:-15%;bottom:-12%;border-radius:50% 50% 0 0 / 40% 40% 0 0;background:radial-gradient(60% 50% at 20% 30%,#FFFFFF,transparent 70%),radial-gradient(50% 50% at 70% 20%,#FFFFFF,transparent 70%),linear-gradient(#FCEFF5,#F3E3EC);opacity:1}
.n3::before,.n3::after{display:none}
.c-top{width:min(100%,460px);display:flex;justify-content:flex-end}
.c-skip{color:#FFFFFF;font-weight:800;font-size:14px;text-decoration:none;background:rgb(0 40 90 / .35);padding:6px 12px;border-radius:99px}
.c-cab{width:min(100%,460px);display:grid;grid-template-columns:1fr auto 1fr;align-items:end;margin-bottom:calc(-1 * clamp(10px,2svh,18px))}
.c-logo{grid-column:2;margin:0;display:flex;justify-content:center}
.c-logo img,.c-logo svg{height:clamp(120px,21svh,190px);width:auto;max-width:62vw;filter:drop-shadow(0 8px 10px rgb(0 30 80 / .35))}
.c-mascota{height:clamp(70px,12svh,120px);width:auto;max-width:100%;object-fit:contain;filter:drop-shadow(0 6px 8px rgb(0 30 80 / .3))}
.c-mascota.izq{grid-column:1;justify-self:end}
.c-mascota.der{grid-column:3;justify-self:start;transform:scaleX(-1)}
.c-juego{width:min(100%,420px,52svh);display:flex;flex-direction:column;align-items:center}
.castillo{position:relative;width:100%;border-radius:22px;padding:clamp(48px,8%,64px) 13% 0;
  background:
    repeating-linear-gradient(0deg,rgb(20 22 60 / .45) 0 3px,transparent 3px 34px),
    repeating-linear-gradient(90deg,rgb(20 22 60 / .35) 0 3px,transparent 3px 58px),
    radial-gradient(120% 80% at 50% 0%,color-mix(in srgb,var(--piedra) 70%,#FFFFFF),var(--piedra) 60%,color-mix(in srgb,var(--piedra) 65%,#000));
  box-shadow:inset 0 0 0 5px color-mix(in srgb,var(--piedra) 60%,#000),inset 0 10px 0 rgb(255 255 255 / .12),0 18px 30px rgb(30 30 80 / .35)}
.castillo::before{content:"";position:absolute;left:-4%;right:-4%;top:-14px;height:30px;border-radius:12px;
  background:linear-gradient(90deg,color-mix(in srgb,var(--piedra) 75%,#000) 0 22%,transparent 22% 26%,color-mix(in srgb,var(--piedra) 75%,#000) 26% 74%,transparent 74% 78%,color-mix(in srgb,var(--piedra) 75%,#000) 78%);
  box-shadow:inset 0 4px 0 rgb(255 255 255 / .15)}
.c-banner{position:absolute;left:14%;right:14%;top:clamp(10px,3%,18px);height:clamp(36px,8.5vw,46px);display:grid;place-items:center;border-radius:4px 4px 10px 10px;
  background:linear-gradient(180deg,#E8343A,#B81C2A);box-shadow:inset 0 0 0 3px #F08A3A,0 5px 0 rgb(0 0 0 / .25);
  font:400 clamp(17px,5vw,24px)/1 "Anton",Impact,sans-serif;letter-spacing:.04em;text-transform:uppercase;text-shadow:0 2px 0 #6A0A12}
.c-banner::before{content:"";position:absolute;left:-6%;right:-6%;top:-6px;height:6px;border-radius:3px;background:#B9783A}
.c-pend{position:absolute;top:22%;width:9%;height:34%;background:linear-gradient(180deg,#E23A6E,#B01C52);clip-path:polygon(0 0,100% 0,100% 100%,50% 86%,0 100%);box-shadow:inset 0 0 0 2px #F08A3A}
.c-pend::after{content:"♛";position:absolute;left:0;right:0;bottom:22%;text-align:center;color:#F7B84A;font-size:clamp(10px,3vw,14px)}
.c-pend.izq{left:2.5%}.c-pend.der{right:2.5%}
.c-rodillos.tablas{background:color-mix(in srgb,var(--piedra) 40%,#0A0C2A);padding:6px;gap:6px;border-radius:12px;box-shadow:inset 0 3px 8px rgb(0 0 0 / .6)}
.c-rodillos .col{aspect-ratio:1/2.4;background:linear-gradient(90deg,#E6E2D2,#FFFDF4 30%,#FFFDF4 70%,#E1DCCB);border-radius:6px}
.c-rodillos .sim{aspect-ratio:1/.8;padding:10% 14%}
.c-rodillos::after{border-color:rgb(226 64 47 / .7);background:rgb(255 214 102 / .14)}
.c-gema{position:absolute;width:5%;aspect-ratio:1;transform:rotate(45deg);border-radius:3px;box-shadow:0 0 8px rgb(255 255 255 / .6)}
.g1{left:4.5%;top:72%;background:#E8443A}.g2{right:4.5%;top:68%;background:#C24BE8}
.c-ranura{margin:14px -2% 0;padding:10px 12px 16px;border-radius:12px 12px 0 0;background:color-mix(in srgb,var(--piedra) 45%,#0A0C2A);box-shadow:inset 0 4px 10px rgb(0 0 0 / .55)}
.c-ranura input{width:100%;min-height:50px;border-radius:10px;border:3px solid color-mix(in srgb,var(--piedra) 55%,#000);background:#FFFDF4;color:#1C1E3A;text-align:center;font-weight:800;font-size:18px;font-variant-numeric:tabular-nums}
.c-ranura input.alerta{animation:sacudir .45s;border-color:#E2402F}
@keyframes sacudir{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
.c-suelo{position:relative;width:118%;height:0}
.cr{position:absolute;bottom:-6px;width:20%}
.cr svg{width:100%;height:auto;display:block}
.cr.izq{left:0}.cr.der{right:0}
.lanza{margin-top:clamp(14px,3svh,26px);width:min(72%,260px);border:0;padding:0 0 10px;border-radius:22px;cursor:pointer;background:#9CA6BE;box-shadow:0 10px 18px rgb(40 40 90 / .3)}
.lanza span{display:block;padding:clamp(10px,2svh,16px) 0 clamp(12px,2.2svh,18px);border-radius:20px 20px 16px 16px;
  background:linear-gradient(180deg,color-mix(in srgb,var(--lanza) 75%,#FFFFFF),var(--lanza) 55%,color-mix(in srgb,var(--lanza) 75%,#000));
  box-shadow:inset 0 -6px 0 rgb(0 0 0 / .2),0 6px 0 color-mix(in srgb,var(--lanza) 55%,#000);
  font:400 clamp(34px,10vw,52px)/1 "Anton",Impact,sans-serif;letter-spacing:.04em;text-transform:uppercase;color:#FFFFFF;
  -webkit-text-stroke:3px #3A0A06;paint-order:stroke fill;text-shadow:0 4px 0 #3A0A06;transition:transform .08s,box-shadow .08s}
.lanza:active:not(:disabled) span{transform:translateY(5px);box-shadow:inset 0 -3px 0 rgb(0 0 0 / .2),0 1px 0 color-mix(in srgb,var(--lanza) 55%,#000)}
.lanza:disabled{cursor:wait}
.lanza:disabled span{filter:saturate(.6) brightness(.9)}
.c-reglas{color:#3C2E5A;font-size:13px;text-align:center;background:rgb(255 255 255 / .7);padding:6px 12px;border-radius:12px;max-width:420px}
.c-reglas b{color:#B81C2A}
.c-res{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:rgb(20 20 50 / .55);backdrop-filter:blur(3px)}
.c-res-card{width:min(100%,360px);background:#FFFFFF;color:#1C1E3A;border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:12px;text-align:center;box-shadow:0 20px 40px rgb(0 0 0 / .35);animation:aparecer .35s cubic-bezier(.2,1.3,.4,1)}
.c-res-card b{font:400 30px/1.1 "Anton",Impact,sans-serif;text-transform:uppercase;color:#4B57A0}
.c-res-card.gano{background:linear-gradient(180deg,#FFF6CC,#FFFFFF 60%)}
.c-res-card.gano b{color:#B81C2A}
@keyframes aparecer{from{transform:scale(.8);opacity:0}}
/* Premio de hoy en el menú */
.m-premio{width:min(100%,560px);display:flex;align-items:center;gap:12px;background:linear-gradient(180deg,#FFE27A,#E3A11B);color:#2A1500;border-radius:16px;padding:12px 14px;box-shadow:0 5px 0 #7A4C00}
.m-premio svg{width:36px;height:36px;flex:0 0 auto}
.m-premio div{flex:1;min-width:0}
.m-premio b{display:block;font-size:16px}
.m-premio a{flex:0 0 auto;background:#2A1500;color:#FFE27A;font-weight:800;font-size:13px;padding:8px 12px;border-radius:10px;text-decoration:none}
.cielo > .c-res{position:fixed}
.cr{width:13%}
.c-logo svg{overflow:visible}
.cielo > .c-res{place-items:end center;background:linear-gradient(transparent 45%,rgb(20 20 50 / .55));backdrop-filter:none;padding-bottom:max(16px,env(safe-area-inset-bottom,0px))}
.c-res-card{padding:16px;gap:8px}
.c-res-card b{font-size:26px}
.c-logo img,.c-logo svg{height:clamp(130px,23svh,200px)}
/* Botón LANZA: tecla roja sobre base gris, letra gruesa blanca */
.lanza{position:relative;width:min(74%,270px);aspect-ratio:2.25;height:auto;margin-top:clamp(14px,3svh,26px);padding:0;border:0;background:none;box-shadow:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
.lanza::before{content:"";position:absolute;left:-7%;right:-7%;top:34%;bottom:0;border-radius:10px;
  background:linear-gradient(180deg,#D9DEE8 0%,#B4BCCB 55%,#8E97AB 100%);clip-path:polygon(9% 0,91% 0,100% 100%,0 100%);filter:drop-shadow(0 8px 10px rgb(40 40 90 / .25))}
.lanza .l-tecla{position:absolute;left:3%;right:3%;top:0;bottom:24%;display:grid;place-items:center;border-radius:18px;
  background:linear-gradient(180deg,color-mix(in srgb,var(--lanza) 60%,#FFB199) 0%,var(--lanza) 38%,color-mix(in srgb,var(--lanza) 85%,#000) 100%);
  box-shadow:inset 0 5px 0 rgb(255 255 255 / .35),inset 0 -4px 0 rgb(0 0 0 / .18),0 10px 0 color-mix(in srgb,var(--lanza) 50%,#3A0000),0 12px 4px rgb(0 0 0 / .25);
  transition:transform .08s,box-shadow .08s;padding:0;font:inherit;text-shadow:none;-webkit-text-stroke:0}
.lanza .l-txt{font:400 clamp(34px,10.5vw,54px)/1 "Lilita One","Anton",Impact,sans-serif;letter-spacing:.01em;text-transform:uppercase;color:#FFFFFF;transform:rotate(-3deg) skewX(-6deg);
  -webkit-text-stroke:2px #5A0C08;paint-order:stroke fill;
  text-shadow:0 2px 0 #7A120C,0 4px 0 #7A120C,0 6px 0 #5A0C08,0 8px 6px rgb(0 0 0 / .3)}
.lanza:active:not(:disabled) .l-tecla{transform:translateY(7px);box-shadow:inset 0 5px 0 rgb(255 255 255 / .35),inset 0 -4px 0 rgb(0 0 0 / .18),0 3px 0 color-mix(in srgb,var(--lanza) 50%,#3A0000)}
.lanza:disabled .l-tecla{filter:saturate(.7) brightness(.92)}
.lanza span{all:unset}
.lanza .l-tecla{position:absolute;left:3%;right:3%;top:0;bottom:24%;display:grid;place-items:center;border-radius:18px}
.lanza.lanza-img{aspect-ratio:auto}
.lanza.lanza-img::before{content:none}
.lanza.lanza-img img{display:block;width:100%;height:auto;transition:transform .08s}
.lanza.lanza-img:active:not(:disabled) img{transform:translateY(5px) scale(.98)}
/* Máquina propia */
.maquina{position:relative;width:100%}
.maquina > img{display:block;width:100%;height:auto;filter:drop-shadow(0 14px 20px rgb(30 30 80 / .3))}

.c-rodillos.ventana::after{left:0;right:0}
.c-banner.suelto{position:relative;left:auto;right:auto;top:auto;width:min(84%,320px);margin-bottom:8px}

.lanza .l-txt{display:inline-block}

.c-top{gap:8px;align-items:center}
.c-prueba{margin-right:auto;background:#FFE27A;color:#2A1500;font-weight:800;font-size:12px;padding:5px 10px;border-radius:99px}

  color:#FFD23F;background:linear-gradient(180deg,#FFF7B0 0%,#FFE14A 38%,#FFB01F 62%,#F57C00 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;

  font:400 14px/1 "Luckiest Guy","Lilita One",Impact,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:#FFF3D6;

.c-tel-ico{position:absolute;left:28px;bottom:27px;width:22px;height:22px;color:#8A5222;pointer-events:none;z-index:1}

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
<script>
/* =====================================================================
   CONFIGURACIÓN — pega aquí los datos de tu proyecto de Supabase.
   Si los dejas vacíos, la app funciona en MODO PRUEBA (datos guardados
   solo en este navegador).
   ===================================================================== */
const CONFIG = {
  SUPABASE_URL: '',       // ej: 'https://abcdxyz.supabase.co'
  SUPABASE_ANON_KEY: ''   // la "Publishable key" (empieza por sb_publishable_)
};

/* ---------- Utilidades ---------- */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const COP = new Intl.NumberFormat('es-CO', {style:'currency', currency:'COP', maximumFractionDigits:0});
const money = v => COP.format(Number(v) || 0).replace(/\s/g, '');
const normTel = t => { let d = String(t || '').replace(/\D/g, ''); if (d.length === 12 && d.startsWith('57')) d = d.slice(2); return d; };
const telValido = d => /^3\d{9}$/.test(d);
const fmtTel = d => d && d.length === 10 ? `${d.slice(0,3)} ${d.slice(3,6)} ${d.slice(6)}` : (d || '');
const DIAS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const hoy = () => iso(new Date());
function fmtFecha(f){ if(!f) return ''; const [y,m,d] = f.split('-').map(Number); const dt = new Date(y, m-1, d); return `${DIAS[dt.getDay()]} ${d} ${MESES[m-1]}`; }
const CARAS = ['😀','😎','🤑','🥳','😍'];
const uid = () => Math.random().toString(36).slice(2, 10);
const lsGet = k => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

const vibrar = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch {} };
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => t.hidden = true, 2600); }
function copiar(texto, btn){
  const listo = () => { if (btn){ const o = btn.dataset.label || btn.textContent; btn.dataset.label = o; btn.textContent = 'Copiado'; setTimeout(() => btn.textContent = o, 1800); } toast('Copiado'); };
  const respaldo = () => { const ta = document.createElement('textarea'); ta.value = texto; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); let ok = false; try { ok = document.execCommand('copy'); } catch {} ta.remove(); ok ? listo() : toast('Mantén presionado el texto para copiarlo'); };
  try { navigator.clipboard.writeText(texto).then(listo, respaldo); } catch { respaldo(); }
}
// Pulsar dos veces para confirmar (los diálogos del navegador no siempre funcionan)
function dobleToque(btn, accion, txt = '¿Seguro? Toca otra vez'){
  if (btn.dataset.armado){ accion(); return; }
  const o = btn.textContent; btn.dataset.armado = '1'; btn.textContent = txt;
  setTimeout(() => { delete btn.dataset.armado; btn.textContent = o; }, 3000);
}
async function reducirImagen(file, max = 900){
  const url = URL.createObjectURL(file);
  const img = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = url; });
  const k = Math.min(1, max / Math.max(img.width, img.height));
  const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
  const png = /png|svg/.test(file.type);
  return new Promise(ok => c.toBlob(b => ok(b), png ? 'image/png' : 'image/jpeg', .85));
}
const blobADataURL = b => new Promise(ok => { const r = new FileReader(); r.onload = () => ok(r.result); r.readAsDataURL(b); });

// "01-02-03 Miguel 3001234567" → {nums:[1,2,3], nombre:'Miguel', tel:'3001234567'}
function parsearLinea(linea){
  let l = ' ' + linea + ' ', tel = '';
  const m = l.match(/(\+?57[\s.-]?)?3\d{2}[\s.-]?\d{3}[\s.-]?\d{4}/);
  if (m){ tel = normTel(m[0]); l = l.replace(m[0], ' '); }
  const nums = [];
  l = l.replace(/(^|[^\d])(\d{1,2})(?=[^\d]|$)/g, (x, a, n) => { nums.push(Number(n)); return a + ' '; });
  const nombre = l.replace(/[-–—,;:|.#*]+/g, ' ').replace(/\s+/g, ' ').trim();
  return { nums: [...new Set(nums)], nombre, tel, linea: linea.trim() };
}
const parsearTexto = t => String(t || '').split('\n').map(s => s.trim()).filter(Boolean).map(parsearLinea);

function agrupar(reservas){
  const m = new Map();
  for (const r of reservas){
    if (!m.has(r.telefono)) m.set(r.telefono, { telefono: r.telefono, nombre: r.nombre, nums: [], ids: [], pagado: true, fijo: false });
    const g = m.get(r.telefono); g.nums.push(Number(r.numero)); g.ids.push(r.id);
    if (!r.pagado) g.pagado = false; if (r.tipo === 'fijo') g.fijo = true;
  }
  const arr = [...m.values()]; arr.forEach(g => g.nums.sort((a,b) => a - b)); arr.sort((a,b) => a.nums[0] - b.nums[0]);
  return arr;
}
const saludo = s => s.jornada === 'noche' ? 'buenas noches' : 'buenos días';
function mensajeCobro(plantilla, s, g){
  const v = { saludo: saludo(s), nombre: g.nombre, numeros: g.nums.map(pad).join(', '), cantidad: g.nums.length,
    valor: money(s.valor_boleta), total: money(g.nums.length * s.valor_boleta), sorteo: s.nombre, fecha: fmtFecha(s.fecha),
    hora: s.hora || '', nequi: fmtTel(s.nequi), titular: s.nequi_titular || '' };
  return String(plantilla || '').replace(/\{(\w+)\}/g, (x, k) => k in v ? v[k] : x);
}
const waLink = (tel, texto) => `https://wa.me/57${normTel(tel)}?text=${encodeURIComponent(texto)}`;
const PLANTILLA_BASE = 'Hola {nombre}, {saludo}. Tienes {numeros} por un valor de {total} en el sorteo {sorteo} del {fecha}. Para cancelar, Nequi {nequi} a nombre de {titular}. ¡Mucha suerte!';

/* =====================================================================
   DATOS — dos versiones con las mismas funciones:
   · Supabase (sitio publicado)  · Modo prueba (este navegador)
   ===================================================================== */
const SB = (CONFIG.SUPABASE_URL && CONFIG.SUPABASE_ANON_KEY && window.supabase)
  ? window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY) : null;
const DEMO = !SB;
const chk = e => { if (e) throw new Error(e.message); };

const apiSupabase = {
  async ajustes(){ const { data, error } = await SB.from('ajustes').select('*').eq('id', 1).maybeSingle(); chk(error); return data || {}; },
  async guardarAjustes(a){ const { error } = await SB.from('ajustes').upsert({ ...a, id: 1 }); chk(error); },
  async sorteos(todos){ let q = SB.from('sorteos').select('*').order('orden').order('fecha').order('creado'); if (!todos) q = q.eq('activo', true); const { data, error } = await q; chk(error); return data || []; },
  async sorteo(id){ const { data, error } = await SB.from('sorteos').select('*').eq('id', id).maybeSingle(); if (error) return null; return data; },
  async guardarSorteo(s){ const fila = { ...s }; if (!fila.id) delete fila.id; const { data, error } = await SB.from('sorteos').upsert(fila).select().single(); chk(error); return data; },
  async borrarSorteo(id){ const { error } = await SB.from('sorteos').delete().eq('id', id); chk(error); },
  async ocupados(id){ const { data, error } = await SB.rpc('numeros_ocupados', { p_sorteo: id }); chk(error); return (data || []).map(Number); },
  async buscarContacto(tel){ const { data, error } = await SB.rpc('buscar_contacto', { p_tel: tel }); if (error) return null; return data || null; },
  async reservar(id, nums, nombre, tel){ const { data, error } = await SB.rpc('reservar', { p_sorteo: id, p_numeros: nums, p_nombre: nombre, p_tel: tel }); if (error) return { ok: false, error: 'No se pudo conectar. Revisa tu internet e intenta de nuevo.' }; return data; },
  async traga(){ const { data, error } = await SB.from('tragamonedas_config').select('*').eq('id', 1).maybeSingle(); chk(error); return data; },
  async guardarTraga(c){ const { error } = await SB.from('tragamonedas_config').upsert({ ...c, id: 1 }); chk(error); },
  async misNumeros(tel){ const { data, error } = await SB.rpc('mis_numeros', { p_tel: tel }); chk(error); (data.sorteos || []).forEach(s => { s.numeros = (s.numeros || []).map(Number); s.pagados = (s.pagados || []).map(Number); }); return { nombre: data.nombre || '', sorteos: data.sorteos || [] }; },
  async girar(tel){ const { data, error } = await SB.rpc('girar', { p_tel: tel }); if (error) return { ok: false, motivo: 'error' }; return data; },
  async login(email, pass){ const { error } = await SB.auth.signInWithPassword({ email, password: pass }); if (error) throw new Error('Correo o contraseña incorrectos.'); },
  async logout(){ await SB.auth.signOut(); },
  async esAdmin(){ const { data } = await SB.auth.getSession(); return !!data.session; },
  async reservas(id){ const { data, error } = await SB.from('reservas').select('*').eq('sorteo_id', id).order('numero'); chk(error); return data || []; },
  async agregarFijos(id, nums, nombre, tel){
    await SB.from('contactos').upsert({ telefono: tel, nombre });
    const filas = nums.map(n => ({ sorteo_id: id, numero: n, telefono: tel, nombre, tipo: 'fijo' }));
    const { error } = await SB.from('reservas').insert(filas);
    if (error) throw new Error(error.code === '23505' ? 'Alguno de esos números ya está ocupado.' : error.message);
  },
  async actualizarReservas(ids, cambios){ const { error } = await SB.from('reservas').update(cambios).in('id', ids); chk(error); },
  async borrarReservas(ids){ const { error } = await SB.from('reservas').delete().in('id', ids); chk(error); },
  async contactos(){ const { data, error } = await SB.from('contactos').select('*').order('nombre'); chk(error); return data || []; },
  async guardarContactos(lista){ const { error } = await SB.from('contactos').upsert(lista); chk(error); },
  async borrarContacto(tel){ const { error } = await SB.from('contactos').delete().eq('telefono', tel); chk(error); },
  async giros(){ const { data, error } = await SB.from('giros').select('*').order('creado', { ascending: false }).limit(200); chk(error); return data || []; },
  async marcarGiro(id, reclamado){ const { error } = await SB.from('giros').update({ reclamado }).eq('id', id); chk(error); },
  async subirImagen(file, max = 900){
    const blob = await reducirImagen(file, max); const ext = blob.type === 'image/png' ? 'png' : 'jpg';
    const ruta = `${Date.now()}-${uid()}.${ext}`;
    const { error } = await SB.storage.from('imagenes').upload(ruta, blob, { contentType: blob.type });
    chk(error); return SB.storage.from('imagenes').getPublicUrl(ruta).data.publicUrl;
  }
};

const DEMO_KEY = 'tablero_sorteos_demo_v2';

  const S = (id, nombre, jornada, hora, valor, color, orden, extra = {}) => ({ ...base, id, nombre, loteria: nombre, jornada, hora, valor_boleta: valor, color, orden, fecha: dia(0),

      S('vip-boyaca', 'VIP Boyacá', 'noche', '10:30 p. m.', 30000, 'rojo', 8, { etiqueta: 'Sábados', fecha: proximo(6), loteria: 'Lotería de Boyacá' })
    ],

      r(s3, 1, '3000000001', 'Ana (ejemplo)', 'fijo', true), r(s3, 2, '3000000001', 'Ana (ejemplo)', 'fijo', true), r(s3, 3, '3000000001', 'Ana (ejemplo)', 'fijo', true),

/* ---------- Modo prueba sincronizado (solo dentro de Claude) ----------
   Si la página se abre en Claude, los datos de prueba y las imágenes se
   guardan en tu cuenta y se ven igual en el computador y en el celular. */
let NUBE = null, ACTIVOS = null, SNAP = {}, COLA = Promise.resolve();
const conTiempo = (p, ms = 10000) => Promise.race([p, new Promise((_, no) => setTimeout(() => no(new Error('tiempo')), ms))]);
function docsDe(m){
  const o = { 'estado/ajustes': m.ajustes, 'estado/traga': m.traga };
  m.sorteos.forEach(s => o['sorteos/' + s.id] = s);
  m.reservas.forEach(r => o['reservas/' + r.id] = r);
  m.contactos.forEach(c => o['contactos/' + c.telefono] = c);
  m.giros.forEach(g => o['giros/' + g.id] = g);
  return o;
}
async function sincronizar(){
  if (!NUBE) return;
  const ahora = docsDe(MEM), ops = [];
  for (const [p, v] of Object.entries(ahora)){
    const j = JSON.stringify(v ?? {});
    if (SNAP[p] !== j){ SNAP[p] = j; ops.push(NUBE.doc(p).set(JSON.parse(j))); }
  }
  for (const p of Object.keys(SNAP)) if (!(p in ahora)){ delete SNAP[p]; ops.push(NUBE.doc(p).delete()); }
  try { await conTiempo(Promise.all(ops), 20000); } catch { toast('No se pudo guardar en la nube. Revisa tu internet.'); }
}
const guardarMem = () => { lsSet(DEMO_KEY, MEM); COLA = COLA.then(sincronizar); };
async function aActivo(url){
  if (!ACTIVOS || !String(url || '').startsWith('data:')) return url;
  try { const blob = await (await fetch(url)).blob(); const r = await ACTIVOS.upload(blob); return '/_blob/' + r.id; } catch { return url; }
}
async function migrarImagenes(m){
  for (const s of m.sorteos){ s.imagen = await aActivo(s.imagen); s.logo_loteria = await aActivo(s.logo_loteria); }
  const d = m.ajustes.diseno || {};
  for (const k of ['fondo', 'logo', 'mascota']) if (d[k]) d[k] = await aActivo(d[k]);
  for (const k of Object.keys(d.sim || {})) d.sim[k] = await aActivo(d.sim[k]);
}
async function conectarNube(){
  if (!DEMO || !window.claude?.use) return;
  try {
    const [db, assets] = await conTiempo(Promise.all([window.claude.use('db'), window.claude.use('assets')]), 8000);
    if (!db) return;
    ACTIVOS = assets;
    const [a, tr, ...cols] = await conTiempo(Promise.all([db.doc('estado/ajustes').get(), db.doc('estado/traga').get(),
      ...['sorteos', 'reservas', 'contactos', 'giros'].map(n => db.collection(n).get())]));
    if (!a.exists){
      // Primera vez: sube lo que ya tenías en este dispositivo
      MEM = lsGet(DEMO_KEY) || semilla(); await migrarImagenes(MEM);
      NUBE = db; await sincronizar();
    } else {
      const [s, r, c, g] = cols.map(q => q.docs.map(d => d.data()));
      MEM = { ajustes: a.data(), traga: tr.exists ? tr.data() : semilla().traga, sorteos: s, reservas: r, contactos: c,
        giros: g.sort((x, y) => String(y.creado).localeCompare(String(x.creado))) };
      NUBE = db; SNAP = Object.fromEntries(Object.entries(docsDe(MEM)).map(([p, v]) => [p, JSON.stringify(v ?? {})]));
      lsSet(DEMO_KEY, MEM);
    }
  } catch (e){ NUBE = null; console.warn('Sin sincronización:', e); }
}

function simularGiro(c){
  const mezcla = [...SIMBOLOS].sort(() => Math.random() - .5), r = Math.random() * 100;
  if (r < c.prob_tres) return { resultado: [mezcla[0], mezcla[0], mezcla[0]], gano: 3, premio: c.premio_tres };
  if (r < c.prob_tres + c.prob_dos) return { resultado: [[mezcla[0],mezcla[0],mezcla[1]],[mezcla[0],mezcla[1],mezcla[0]],[mezcla[1],mezcla[0],mezcla[0]]][Math.floor(Math.random()*3)], gano: 2, premio: c.premio_dos };
  return { resultado: mezcla.slice(0, 3), gano: 0, premio: '' };
}
const yaJugoHoy = () => !!lsGet('giro_' + hoy());

async function vistaInicio(forzar = false){
  const cfg = await api.traga().catch(() => null);
  if (!cfg || !cfg.activo){ location.replace('#sorteos'); return; }
  const prueba = forzar && await api.esAdmin().catch(() => false);
  const previo = prueba ? null : lsGet('giro_' + hoy());
  if (previo && !forzar){ location.replace('#sorteos'); return; }
  const d = DIS(), medio = previo?.resultado?.map(simKey) || [azar(), azar(), azar()];
  const campoTel = `<i class="clavo c1"></i><i class="clavo c2"></i><i class="clavo c3"></i><i class="clavo c4"></i>
            <label for="f-tel" class="c-tabla-tit">Tu celular para jugar</label>
            <input id="f-tel" type="tel" inputmode="numeric" autocomplete="tel" placeholder="Escribe tu celular" enterkeyhint="go" value="${esc(fmtTel(lsGet('mi_tel') || ''))}">`;
  const mascota = cls => d.mascota ? `<img class="c-mascota ${cls}" src="${esc(d.mascota)}" alt="">` : '';
  app().innerHTML = `
    <section class="cielo ${d.fondo ? 'con-fondo' : ''}" style="--sim:${Number(d.simEscala) || 62}%;${d.fondo ? `--fondo:url('${esc(d.fondo)}');` : ''}${d.marco ? `--piedra:${esc(d.marco)};` : ''}${d.boton ? `--lanza:${esc(d.boton)};` : ''}">
      ${d.fondo ? '' : '<div class="c-nubes" aria-hidden="true"><i class="n1"></i><i class="n2"></i><i class="n3"></i></div>'}
      <div class="c-top">${prueba ? '<span class="c-prueba">Modo prueba · no cuenta como tiro</span><a class="c-skip" href="#admin">Volver al panel</a>' : '<a class="c-skip" href="#sorteos">Saltar →</a>'}</div>
      ${(d.logo && !d.sinLogo) || d.mascota ? `<header class="c-cab">
        ${mascota('izq')}
        <div class="c-logo">${d.logo && !d.sinLogo ? `<img src="${esc(d.logo)}" alt="">` : ''}</div>
        ${mascota('der')}
      </header>` : ''}
      <h1 class="c-titulo"><span id="c-msg" data-t="${previo ? 'Ya jugaste hoy' : 'Tiro gratis del día'}">${previo ? 'Ya jugaste hoy' : 'Tiro gratis del día'}</span></h1>
      <form class="c-juego" id="f-giro" novalidate>
        ${d.maquina ? `
        <div class="maquina">
          <img src="${esc(d.maquina)}" alt="">
          ${rodillosHTML(medio, 'ventana' + (d.rodBlanco ? ' blancos' : ''), ventanaStyle(d.ventana))}
        </div>
        <div class="c-ranura suelta">${campoTel}</div>` : `
        <div class="castillo">
          <div class="c-banner"><span>¡Gira y gana!</span></div>
          <i class="c-pend izq" aria-hidden="true"></i><i class="c-pend der" aria-hidden="true"></i>
          ${rodillosHTML(medio)}
          <i class="c-gema g1" aria-hidden="true"></i><i class="c-gema g2" aria-hidden="true"></i>
          <div class="c-ranura">${campoTel}</div>
        </div>
        <div class="c-suelo" aria-hidden="true"><span class="cr izq">${CRISTAL('#F0457A')}</span><span class="cr der">${CRISTAL('#A84BF0')}</span></div>`}
        <button class="lanza ${d.lanzaImg ? 'lanza-img' : ''}" id="f-btn" type="submit" aria-label="${previo ? 'Ver sorteos' : 'Lanza'}">${d.lanzaImg ? `<img src="${esc(d.lanzaImg)}" alt="">` : `<span class="l-tecla"><span class="l-txt">${previo ? 'Ver sorteos' : 'Lanza'}</span></span>`}</button>
      </form>
      <p class="c-reglas">3 iguales en la línea del medio: <b>${esc(cfg.premio_tres)}</b> · 2 iguales: <b>${esc(cfg.premio_dos)}</b></p>
      <div class="c-res" id="f-res" hidden></div>
    </section>`;
  const res = $('#f-res'), btn = $('#f-btn'), msgEl = $('#c-msg');

  if (previo) resaltar(previo);
  const irSorteos = () => { if (location.hash !== '#sorteos') location.hash = 'sorteos'; };
  const terminar = (g, pre = '') => {

      msg.textContent = g.gano === 3 ? '¡Ganaste!' : g.gano === 2 ? '¡2 iguales!' : 'Casi…';
      res.hidden = false;

    res.innerHTML = `<div class="c-res-card ${g.gano ? 'gano' : ''}">

      return terminar(g);
    }
    if (!telValido(tel)){ msg.textContent = 'Escribe tu celular'; telIn.classList.add('alerta'); telIn.focus(); setTimeout(() => telIn.classList.remove('alerta'), 600); return; }
    telIn.blur(); btn.disabled = true; lsSet('mi_tel', tel); vibrar(15);
    msg.textContent = '¡Suerte!';
    $$('.sim.gana').forEach(x => x.classList.remove('gana'));
    const r = await api.girar(tel);
    if (!(r.ok || r.motivo === 'ya_giro') || !r.resultado){
      if (r.motivo === 'ya_giro'){ lsSet('giro_' + hoy(), { resultado: [], gano: r.gano || 0, premio: r.premio || '', tel }); msg.textContent = 'Ya jugaste hoy'; return terminar({ gano: r.gano || 0, premio: r.premio || '' }, 'Ya habías jugado hoy con este celular. '); }
      btn.disabled = false;
      msg.textContent = r.motivo === 'inactiva' ? 'Ruleta apagada' : 'Intenta de nuevo';
      return;
    }
    const final = r.resultado.map(simKey);
    await girarRodillos(final);
    const g = { resultado: final, gano: r.gano || 0, premio: r.premio || '', tel };
    lsSet('giro_' + hoy(), g); resaltar(g); if (g.gano) vibrar([40, 60, 40]);
    terminar(g, r.ok ? '' : 'Ya habías jugado hoy con este celular. ');
  });
}

async function girarRodillos(final){
  const lento = !matchMedia('(prefers-reduced-motion: reduce)').matches;
  const tareas = [0,1,2].map(c => new Promise(ok => {
    const strip = $(`#col${c} .strip`), alto = $(`#col${c}`).offsetHeight / 3;
    const relleno = Array.from({ length: 16 + c * 5 }, azar);
    const actuales = $$('.sim', strip).map(x => x.dataset.k);
    const todos = [...actuales, ...relleno, azar(), final[c], azar()];
    if (!lento){ strip.innerHTML = todos.slice(-3).map(k => celdaSim(k)).join(''); return ok(); }
    strip.style.transition = 'none'; strip.style.transform = 'translateY(0)';
    strip.innerHTML = todos.map(k => celdaSim(k)).join('');
    strip.offsetHeight;
    strip.style.transition = `transform ${1.3 + c * .45}s cubic-bezier(.12,.75,.18,1.02)`;
    strip.style.transform = `translateY(${-(todos.length - 3) * alto}px)`;
    const fin = () => { strip.style.transition = 'none'; strip.style.transform = 'translateY(0)'; strip.innerHTML = todos.slice(-3).map(k => celdaSim(k)).join(''); ok(); };
    strip.addEventListener('transitionend', fin, { once: true });
    setTimeout(() => { if (strip.children.length > 3) fin(); }, (1.3 + c * .45) * 1000 + 400);
  }));
  await Promise.all(tareas);
}

function resaltar(g){
  if (!g.gano) return;
  const rs = g.resultado.map(simKey);
  [0,1,2].forEach(c => { const cel = $$(`#col${c} .sim`)[1]; if (cel && rs.filter(x => x === rs[c]).length >= 2) cel.classList.add('gana'); });
}

  naranja:  { c1: '#FF9A2E', c2: '#F05A05', neon: '#FF8F2E', nombre: 'Naranja' },
  verde:    { c1: '#4FD443', c2: '#1C8F27', neon: '#5CFF6A', nombre: 'Verde' },

  dorado:   { c1: '#F7C948', c2: '#C08414', neon: '#FFD24A', nombre: 'Dorado' }

function temaDe(s){

      res.innerHTML = `<div class="panel stack"><b>No tienes números apartados con el celular ${esc(fmtTel(tel))}.</b><p class="muted">Revisa que sea el mismo celular con el que apartaste, o elige tus números ahora.</p><a class="btn btn-primary btn-block" href="#sorteos">Elegir un sorteo</a></div>`;

function refrescarTablero(){
  $$('.cell').forEach(b => {

async function agregarFijosDesdeTexto(sorteoId, texto){
  const lineas = parsearTexto(texto), errores = []; let ok = 0;
  if (!lineas.length) return { ok, errores };
  const contactos = await api.contactos();
  for (const l of lineas){
    if (!l.nums.length){ errores.push(`“${l.linea}”: no encontré números.`); continue; }
    let tel = l.tel, nombre = l.nombre;
    if (!tel){ const c = contactos.find(c => c.nombre.toLowerCase() === nombre.toLowerCase()); if (c) tel = c.telefono; }
    if (!tel && nombre){ errores.push(`“${l.linea}”: falta el celular de ${nombre}.`); continue; }
    if (!nombre){ const c = contactos.find(c => c.telefono === tel); if (c) nombre = c.nombre; }
    if (!nombre){ errores.push(`“${l.linea}”: falta el nombre.`); continue; }
    try { await api.agregarFijos(sorteoId, l.nums, nombre, tel); ok++; } catch (er){ errores.push(`“${l.linea}”: ${er.message}`); }
  }
  return { ok, errores };
}

  rrect(ctx, M, y, W - M * 2, hT, 28); g = ctx.createLinearGradient(0, y, 0, y + hT); g.addColorStop(0, '#FFE98A'); g.addColorStop(1, '#E3A11B'); ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = '#7A4C00'; ctx.lineWidth = 3; ctx.stroke();
  ctx.fillStyle = 'rgba(122,76,0,.35)'; ctx.fillRect(divX - 1.5, y + 22, 3, hT - 44);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#2A1500';
  const cTot = (M + divX) / 2, cBol = (divX + W - M) / 2;
  ctx.font = `800 26px ${BODY}`; ctx.fillText('PREMIO TOTAL', cTot, y + 36); ctx.fillText('BOLETA', cBol, y + 36);

  // premios por cifras
  if (premios.length){
    y = 316 + hT + 18; const gap = 16, hP = 108, pw = (W - M * 2 - gap * (premios.length - 1)) / premios.length;
    premios.forEach(([nom, v], i) => {
      const x = M + i * (pw + gap); rrect(ctx, x, y, pw, hP, 22); ctx.fillStyle = 'rgba(12,8,10,.72)'; ctx.fill();
      ctx.strokeStyle = '#E8BE72'; ctx.lineWidth = 2.5; ctx.stroke();
      ctx.fillStyle = '#F3D9A4'; ctx.font = `800 23px ${BODY}`; ctx.fillText(nom.toUpperCase(), x + pw / 2, y + 34);
      ctx.fillStyle = '#FFFFFF'; textoAjustado(ctx, money(v), x + pw / 2, y + 74, pw - 28, 48, ANTON);

  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  // tablero
  const ocup = new Set(ocupados);

  for (let n = 0; n < 100; n++){
    const cx = M + (n % 10) * (celda + 10), cy = tabTop + Math.floor(n / 10) * (celda + 10);

      else monedaCanvas(ctx, cx + celda / 2, cy + celda / 2, celda * .32);
    } else {
      ctx.fillStyle = '#FFFFFF'; ctx.fill();
      ctx.fillStyle = '#141418'; ctx.font = `${Math.round(celda * .46)}px ${ANTON}`; ctx.fillText(pad(n), cx + celda / 2, cy + celda / 2 + 2);
    }
  }
  ctx.textBaseline = 'alphabetic';
  y = tabBot + 30;
  const libres = 100 - ocup.size;
  if (fondoImg){ rrect(ctx, W / 2 - 330, y - 16, 660, 52, 26); ctx.fillStyle = 'rgba(12,8,10,.7)'; ctx.fill(); }
  ctx.textBaseline = 'middle'; ctx.font = `700 30px ${BODY}`; ctx.fillStyle = '#F3D9A4';
  ctx.fillText(`${libres} ${libres === 1 ? 'número disponible' : 'números disponibles'}  ·  tapados = ocupados`, W / 2, y + 10); ctx.textBaseline = 'alphabetic';
  // pie: Nequi y link
  y = tabBot + 64;
  rrect(ctx, M, y, W - M * 2, 200, 28); ctx.fillStyle = '#FFFFFF'; ctx.fill(); ctx.strokeStyle = '#E8BE72'; ctx.lineWidth = 3; ctx.stroke();
  ctx.fillStyle = '#0E6A4E'; ctx.font = `800 26px ${BODY}`; ctx.fillText('APARTA TU NÚMERO Y PAGA POR NEQUI', W / 2, y + 50);
  ctx.fillStyle = '#11231E'; ctx.font = `68px ${ANTON}`; ctx.fillText(s.nequi ? fmtTel(s.nequi) : 'Escríbenos por WhatsApp', W / 2, y + 128);
  ctx.fillStyle = '#56675F'; ctx.font = `600 28px ${BODY}`;
  ctx.fillText(s.nequi_titular ? 'A nombre de ' + s.nequi_titular : (AJ.whatsapp ? 'WhatsApp ' + fmtTel(AJ.whatsapp) : ''), W / 2, y + 172);

  return new Promise(ok => c.toBlob(ok, 'image/png'));

async function abrirExportar(s, ocupados){
  const capa = document.createElement('div'); capa.className = 'exp-capa';
  capa.innerHTML = `<div class="exp-caja" role="dialog" aria-label="Imagen del tablero"><div class="adm-head"><h3>Imagen del tablero</h3><button class="btn btn-sm" id="exp-x">Cerrar</button></div><p class="muted">Creando imagen…</p></div>`;
  document.body.appendChild(capa);
  const cerrar = () => { capa.remove(); if (capa._url) URL.revokeObjectURL(capa._url); };
  $('#exp-x', capa).addEventListener('click', cerrar);
  capa.addEventListener('click', e => { if (e.target === capa) cerrar(); });
  let blob;
  try { blob = await imagenTablero(s, ocupados); } catch (er){ $('.exp-caja p', capa).textContent = 'No se pudo crear la imagen: ' + er.message; return; }
  const nombre = `tablero-${String(s.nombre).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-')}-${s.fecha || hoy()}.png`;
  const url = capa._url = URL.createObjectURL(blob);
  const file = (() => { try { return new File([blob], nombre, { type: 'image/png' }); } catch { return null; } })();
  const puedeCompartir = !!(file && navigator.canShare && navigator.canShare({ files: [file] }));
  const dl = await (window.claude?.use ? window.claude.use('downloads').catch(() => null) : null);
  const link = location.href.split('#')[0] + '#sorteo-' + s.id;
  const texto = `${s.nombre} · ${fmtFecha(s.fecha)}${s.hora ? ' ' + s.hora : ''}\nAparta tus números aquí: ${link}`;
  $('.exp-caja', capa).innerHTML = `
    <div class="adm-head"><h3>Imagen del tablero</h3><button class="btn btn-sm" id="exp-x">Cerrar</button></div>
    <img class="exp-img" src="${url}" alt="Tablero de ${esc(s.nombre)}">
    <div class="stack" style="gap:8px">
      ${puedeCompartir ? '<button class="btn btn-primary btn-block" id="exp-share">Compartir por WhatsApp</button>' : ''}
      <button class="btn ${puedeCompartir ? '' : 'btn-primary'} btn-block" id="exp-save">Guardar imagen</button>
      <button class="btn btn-block" id="exp-texto">Copiar mensaje con el link</button>
      <label class="btn btn-block" for="exp-fondo">${s.fondo_imagen ? 'Cambiar fondo de esta imagen' : 'Ponerle un fondo a esta imagen'}</label>
      <input id="exp-fondo" type="file" accept="image/*" hidden>
      ${s.fondo_imagen ? '<button class="link-btn small" id="exp-quitar" style="align-self:center">Quitar fondo</button>' : ''}
      <p class="hint" style="margin:0">También puedes mantener presionada la imagen para guardarla. Se actualiza con los números ocupados en este momento.</p>
    </div>`;
  $('#exp-x', capa).addEventListener('click', cerrar);
  $('#exp-texto', capa).addEventListener('click', e => copiar(texto, e.currentTarget));
  const cambiarFondo = async url => {
    try { const guardado = await api.guardarSorteo({ ...s, fondo_imagen: url }); cerrar(); abrirExportar({ ...s, ...guardado, fondo_imagen: url }, ocupados); toast(url ? 'Fondo guardado para este sorteo' : 'Fondo quitado'); }
    catch (er){ toast('No se pudo guardar el fondo: ' + er.message); }
  };
  $('#exp-fondo', capa).addEventListener('change', async e => {
    const f = e.target.files[0]; if (!f) return; toast('Subiendo fondo…');
    try { await cambiarFondo(await api.subirImagen(f, 1400)); } catch (er){ toast('No se pudo subir: ' + er.message); }
  });
  $('#exp-quitar', capa)?.addEventListener('click', () => cambiarFondo(''));
  $('#exp-share', capa)?.addEventListener('click', async () => { try { await navigator.share({ files: [file], text: texto }); } catch {} });
  $('#exp-save', capa).addEventListener('click', async () => {
    if (dl){ try { await dl.save({ filename: nombre, data: blob }); toast('Imagen guardada'); } catch (er){ if (er?.code !== 'cancelled') toast('Mantén presionada la imagen para guardarla'); } return; }
    const a = document.createElement('a'); a.href = url; a.download = nombre; document.body.appendChild(a); a.click(); a.remove();
  });
}

  $('#t-form').addEventListener('submit', async e => {
    e.preventDefault();
    await api.guardarTraga({ activo: $('#t-activo').checked, prob_tres: Number($('#t-p3').value) || 0, premio_tres: $('#t-r3').value.trim(), prob_dos: Number($('#t-p2').value) || 0, premio_dos: $('#t-r2').value.trim() });
    toast('Tragamonedas guardada');
  });
  $$('[data-rec]').forEach(b => b.addEventListener('click', async () => { await api.marcarGiro(b.dataset.rec, b.dataset.v === '1'); pintarTragaAdmin(); }));
}

/* ---- Diseño de la ruleta ---- */
function pintarDiseno(){
  const a = $('#adm');
  const d = JSON.parse(JSON.stringify(AJ.diseno || {})); d.sim = d.sim || {};
  const prev = url => url ? `<img src="${esc(url)}" alt="">` : 'Sin imagen';
  const picker = (id, t, url, nota = '') => `<div class="field"><label for="d-${id}">${t}</label><div class="img-pick"><div class="img-prev" id="pv-${id}">${prev(url)}</div><div class="stack" style="gap:6px"><input id="d-${id}" type="file" accept="image/*"><button type="button" class="link-btn small" data-q="${id}">Quitar</button>${nota ? `<span class="hint" style="margin:0">${nota}</span>` : ''}</div></div></div>`;
  a.innerHTML = `
    <div class="adm-head"><h2>Diseño</h2><a class="btn btn-sm btn-primary" href="#ruleta">Probar la ruleta</a></div>
    <p class="muted">Cambia el look de la ruleta y del tablero. Lo que dejes vacío usa el diseño por defecto.</p>
    <form id="d-form" class="stack" novalidate>
      <div class="panel stack"><h3>Pantalla</h3>
        <div class="grid2">
          ${picker('fondo', 'Imagen de fondo', d.fondo, 'Mejor vertical, tipo pantalla de celular.')}
          ${picker('logo', 'Logo del título', d.logo, 'Reemplaza el emblema de El Pato de la Suerte. PNG sin fondo.')}
          ${picker('mascota', 'Mascota a los lados del logo', d.mascota, 'Opcional. PNG sin fondo. Sale a ambos lados.')}
        </div>
      </div>
      <div class="panel stack"><h3>Máquina de la ruleta</h3>
        <p class="muted small">Sube la imagen de la máquina que quieras (PNG, mejor vertical). Luego mueve las barras para que los rodillos queden justo en el hueco de tu imagen. Si la dejas vacía se usa el castillo.</p>
        <div class="grid2">${picker('maquina', 'Imagen de la máquina', d.maquina)}</div>
        <div id="maq-ajuste" ${d.maquina ? '' : 'hidden'} class="maq-ajuste">
          <div class="maq-prev" id="maq-prev"><img id="maq-img" src="${esc(d.maquina || '')}" alt=""><div class="maq-rect" id="maq-rect"><i></i><i></i><i></i></div></div>
          <div class="maq-sliders">
            ${[['x', 'Izquierda'], ['y', 'Arriba'], ['w', 'Ancho'], ['h', 'Alto']].map(([k, tt]) => `<div class="field"><label for="v-${k}">${tt} <span class="num" id="v-${k}-n"></span></label><input id="v-${k}" type="range" min="0" max="100" step="0.5" value="${esc(({ ...VENTANA_BASE, ...(d.ventana || {}) })[k])}"></div>`).join('')}
            <div class="field" id="campo-sim"><label for="v-sim">Tamaño de los íconos <span class="num" id="v-sim-n">${Number(d.simEscala) || 62}%</span></label><input id="v-sim" type="range" min="35" max="100" step="1" value="${Number(d.simEscala) || 62}"></div>
            <label class="check"><input id="v-blanco" type="checkbox" ${d.rodBlanco ? 'checked' : ''}> Poner fondo blanco a los rodillos</label>
            <label class="check"><input id="v-sinlogo" type="checkbox" ${d.sinLogo ? 'checked' : ''}> Ocultar el logo de arriba (si tu imagen ya trae logo)</label>
          </div>
        </div>
      </div>
      <div class="panel stack"><h3>Íconos de los rodillos</h3><div id="sim-slot"></div></div>
      <div class="panel stack"><h3>Botón LANZA</h3>
        <p class="muted small">Si quieres otro botón, sube su imagen (PNG sin fondo). Si la dejas vacía se usa el botón rojo LANZA.</p>
        <div class="grid2">${picker('lanzaImg', 'Imagen del botón', d.lanzaImg)}</div>
      </div>
      <div class="panel stack"><h3>Números ocupados</h3>
        <p class="muted small">Este logo tapa los números que ya están apartados en el tablero de todos los sorteos. Usa una imagen cuadrada en PNG sin fondo. Si un sorteo tiene su propio logo, se usa ese.</p>
        <div class="grid2">${picker('ocupado', 'Logo para números ocupados', d.ocupado, 'Si lo dejas vacío se usa la moneda de oro.')}</div>
      </div>
      <div class="panel stack"><h3>Símbolos del tablero</h3>
        <p class="muted small">Sube una imagen para reemplazar cada símbolo. Usa imágenes cuadradas y sin fondo (PNG).</p>
        <div class="grid2">${SIMBOLOS.map((k, i) => picker('sim-' + k, `Símbolo ${i + 1}: ${NOMBRE_SIM[k]}`, d.sim[k])).join('')}</div>
      </div>
      <div class="panel stack"><h3>Colores</h3>
        <div class="grid2">
          <div class="field"><label for="d-marco">Color del castillo (si no subes máquina)</label><input id="d-marco" type="color" value="${esc(d.marco || '#4B57A0')}" style="min-height:52px;padding:4px"></div>
          <div class="field"><label for="d-boton">Color del botón LANZA (si no subes imagen)</label><input id="d-boton" type="color" value="${esc(d.boton || '#E2402F')}" style="min-height:52px;padding:4px"></div>
        </div>
      </div>
      <div class="row-actions"><button class="btn btn-primary" type="submit" id="d-save">Guardar diseño</button><button class="btn btn-danger" type="button" id="d-reset">Volver al diseño original</button></div>
    </form>`;
  const ajustarRect = () => {
    const v = { x: +$('#v-x').value, y: +$('#v-y').value, w: +$('#v-w').value, h: +$('#v-h').value };
    d.ventana = v; Object.assign($('#maq-rect').style, { left: v.x + '%', top: v.y + '%', width: v.w + '%', height: v.h + '%' });
    ['x','y','w','h'].forEach(k => $('#v-' + k + '-n').textContent = v[k] + '%');
  };
  const set = (id, url) => {
    if (id.startsWith('sim-')) d.sim[id.slice(4)] = url; else d[id] = url; $('#pv-' + id).innerHTML = prev(url);
    if (id === 'maquina'){ $('#maq-ajuste').hidden = !url; $('#maq-img').src = url || ''; }
  };
  $('#sim-slot').appendChild($('#campo-sim'));
  ['x','y','w','h'].forEach(k => $('#v-' + k).addEventListener('input', ajustarRect)); ajustarRect();
  if (!(AJ.diseno || {}).ventana) delete d.ventana;
  $('#v-blanco').addEventListener('change', e => d.rodBlanco = e.target.checked);
  $('#v-sim').addEventListener('input', e => { d.simEscala = +e.target.value; $('#v-sim-n').textContent = e.target.value + '%'; });
  $('#v-sinlogo').addEventListener('change', e => d.sinLogo = e.target.checked);
  $$('#d-form input[type=file]').forEach(inp => inp.addEventListener('change', async () => {
    const f = inp.files[0]; if (!f) return; const id = inp.id.slice(2); $('#pv-' + id).textContent = 'Subiendo…';
    try { set(id, await api.subirImagen(f, id === 'fondo' || id === 'maquina' ? 1400 : 600)); if (id === 'maquina') ajustarRect(); }
    catch (er){ $('#pv-' + id).textContent = 'Error'; toast('No se pudo subir: ' + er.message); }
  }));
  $$('[data-q]').forEach(b => b.addEventListener('click', () => set(b.dataset.q, '')));
  const guardar = async nuevo => {
    try { await api.guardarAjustes({ diseno: nuevo }); AJ.diseno = nuevo; toast('Diseño guardado'); }
    catch (er){ toast('No se pudo guardar: ' + er.message); }
  };
  $('#d-form').addEventListener('submit', async e => {
    e.preventDefault();
    d.marco = $('#d-marco').value; d.boton = $('#d-boton').value;
    if (d.maquina) ajustarRect(); else delete d.ventana;
    if (d.marco.toLowerCase() === '#4b57a0') delete d.marco;
    if (d.boton.toLowerCase() === '#e2402f') delete d.boton;
    await guardar(d);
  });
  $('#d-reset').addEventListener('click', e => dobleToque(e.currentTarget, async () => { await guardar({}); pintarDiseno(); }));
}

/* ---- Ajustes ---- */
function pintarAjustes(){
  const a = $('#adm');
  const ejemplo = mensajeCobro(AJ.plantilla || PLANTILLA_BASE, { jornada: 'dia', valor_boleta: 5000, nombre: 'Paisita Día', fecha: hoy(), nequi: '3001234567', nequi_titular: 'Miguel' }, { nombre: 'Carlos', nums: [5, 7, 99] });
  a.innerHTML = `
    <h2>Ajustes</h2>
    <form id="a-form" class="panel stack" novalidate>
      <div class="grid2">
        <div class="field"><label for="a-neg">Nombre de tu negocio</label><input id="a-neg" type="text" value="${esc(AJ.negocio || '')}"></div>
        <div class="field"><label for="a-wa">Tu WhatsApp para comprobantes</label><input id="a-wa" type="tel" inputmode="numeric" placeholder="300 123 4567" value="${esc(fmtTel(AJ.whatsapp || ''))}"></div>
      </div>
      <div class="field"><label for="a-pl">Mensaje de cobro</label><textarea id="a-pl">${esc(AJ.plantilla || PLANTILLA_BASE)}</textarea>
        <p class="hint">Palabras que se reemplazan solas: {saludo} (buenos días o buenas noches según la jornada), {nombre}, {numeros}, {cantidad}, {valor}, {total}, {sorteo}, {fecha}, {hora}, {nequi}, {titular}.</p></div>
      <div class="field"><span class="eyebrow">Así se verá</span><pre class="code" id="a-prev">${esc(ejemplo)}</pre></div>
      <div class="row-actions"><button class="btn btn-primary" type="submit">Guardar ajustes</button></div>
    </form>
    ${DEMO ? `<div class="panel stack"><h3>Cómo publicarlo</h3>
      <p class="muted">${NUBE ? 'Estás en modo prueba sincronizado: tus datos e imágenes se guardan en tu cuenta de Claude y los ves igual en el computador y en el celular. Tus clientes todavía no pueden entrar.' : 'Estás en modo prueba: los datos solo se guardan en este navegador.'} Para que tus clientes entren desde un link:</p>
      <ol class="steps">
        <li>Crea una cuenta gratis en <b>supabase.com</b> y un proyecto nuevo.</li>
        <li>En el proyecto abre <b>SQL Editor</b>, pega el archivo <b>supabase.sql</b> y pulsa <b>Run</b>.</li>
        <li>En <b>Authentication → Users</b> crea tu usuario administrador (tu correo y una contraseña).</li>
        <li>En <b>Authentication → Sign In / Providers</b> apaga <b>Allow new users to sign up</b>, para que nadie más pueda crear cuenta.</li>
        <li>En <b>Project Settings → API</b> copia la <b>Project URL</b> y la clave <b>anon public</b>, y pégalas al inicio de este archivo, en CONFIG.</li>
        <li>Entra a <b>app.netlify.com/drop</b> y arrastra la carpeta con el archivo <b>index.html</b>. Te da el link de tu página.</li>
      </ol></div>
      <div class="panel stack"><h3>Datos de prueba</h3><p class="muted small">Vuelve a los sorteos y contactos de ejemplo.</p><div class="row-actions"><button class="btn btn-danger" id="a-reset">Restablecer datos de prueba</button></div></div>` : ''}`;
  const prev = () => $('#a-prev').textContent = mensajeCobro($('#a-pl').value, { jornada: 'dia', valor_boleta: 5000, nombre: 'Paisita Día', fecha: hoy(), nequi: '3001234567', nequi_titular: 'Miguel' }, { nombre: 'Carlos', nums: [5, 7, 99] });
  $('#a-pl').addEventListener('input', prev);
  $('#a-form').addEventListener('submit', async e => {
    e.preventDefault();
    const datos = { negocio: $('#a-neg').value.trim() || 'Mis Sorteos', whatsapp: normTel($('#a-wa').value), plantilla: $('#a-pl').value };
    await api.guardarAjustes(datos); AJ = { ...AJ, ...datos }; toast('Ajustes guardados'); vistaAdmin();
  });
  $('#a-reset')?.addEventListener('click', e => dobleToque(e.currentTarget, () => { MEM = semilla(); guardarMem(); AJ = clon(MEM.ajustes); toast('Datos de prueba restablecidos'); vistaAdmin(); }));
}

/* ---------- Arranque ---------- */
(async () => {
  app().innerHTML = '<p class="wrap muted" style="padding-block:40px;text-align:center">Cargando…</p>';
  await conectarNube();
  try { AJ = await api.ajustes(); } catch { AJ = {}; }
  addEventListener('hashchange', ruta);
  ruta();
})();
</script>
